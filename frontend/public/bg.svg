<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="130"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="#060606"/>
  <g filter="url(#blur)">
    <circle cx="1380" cy="90" r="270" fill="#f59e0b" opacity="0.30"/>
    <circle cx="160" cy="930" r="310" fill="#ca8a04" opacity="0.24"/>
    <ellipse cx="820" cy="540" rx="460" ry="150" fill="#facc15" opacity="0.07"/>
    <circle cx="60" cy="120" r="170" fill="#78350f" opacity="0.35"/>
    <circle cx="1500" cy="880" r="200" fill="#713f12" opacity="0.35"/>
  </g>
  <rect width="1600" height="1000" fill="url(#vignette)"/>
</svg>
